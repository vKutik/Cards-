  :root{--sans:'InterVar',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --paper:#EFEDE7;--card:#fff;--ink:#1A2028;--soft:#5C6670;--line:#CFD3CB;
    --green:#1D6560;--green-d:#134A46;--amber:#B4600F;--red:#93342A;--track:#CBC8BF}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:16.5px;line-height:1.55;
    font-family:var(--sans);font-weight:400;letter-spacing:-.005em;padding:18px 16px 60px;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  .wrap{max-width:34rem;margin:0 auto}
  h1{font-weight:640;font-size:1.7rem;letter-spacing:-.025em;margin:6px 0 16px}
  h2{font-size:.95rem;font-weight:620;letter-spacing:-.01em;margin:0 0 10px}
  p{margin:0 0 12px}
  .muted{color:var(--soft);font-size:.93rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:18px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border-radius:4px}
  .go{display:block;width:100%;background:var(--green);color:#fff;border:none;padding:14px;font-weight:580;letter-spacing:-.005em;margin-bottom:10px}
  .go:hover{background:var(--green-d)}
  .go.ghost{background:#fff;color:var(--green-d);border:1px solid var(--green)}
  .go[disabled]{opacity:.4;cursor:default}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    padding:12px 14px;margin-bottom:8px;color:var(--ink)}
  .opt:hover{border-color:var(--green)}
  .opt.right{border-color:var(--green);background:#EEF5F3}
  .opt.wrong{border-color:var(--red);background:#FBEFEE}
  .word{font-size:2.3rem;font-weight:640;letter-spacing:-.035em;line-height:1.08;margin:6px 0 6px}
  .pos{color:var(--soft);font-size:.92rem;font-weight:450;letter-spacing:0;margin-bottom:14px}
  .say{background:#fff;border:1px solid var(--line);color:var(--green-d);padding:8px 14px;font-size:.88rem;font-weight:520;margin-bottom:14px}
  .def{font-size:1.05rem;font-weight:450;margin-bottom:12px}
  .ex{background:#F6F5F1;border-left:3px solid var(--line);padding:11px 13px;margin-bottom:10px;font-size:.98rem}
  .ex b{background:#E4EDE9;padding:0 3px;border-radius:2px;font-weight:600}
  .cloze{font-size:1.15rem;font-weight:450;line-height:1.5;margin:14px 0 18px}
  .cloze u{text-decoration:none;border-bottom:2px solid var(--green);padding:0 26px}
  .anto{font-size:.95rem;color:var(--soft)}
  .exnav{font-size:.8rem;color:var(--soft);margin-top:2px}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grade button{padding:13px 8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:580;letter-spacing:-.01em}
  .grade button small{display:block;font-weight:400;color:var(--soft);font-size:.78rem}
  .g0{border-color:var(--red)!important;color:var(--red)!important}
  .g3{border-color:var(--green)!important;color:var(--green-d)!important}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .row b{font-weight:600;font-variant-numeric:tabular-nums}
  .row:last-child{border-bottom:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .pill{font-size:.8rem;font-weight:450;color:var(--soft);letter-spacing:0}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
  .bar span{display:block;height:100%;background:var(--green);width:0}
  .gauge{margin:10px 0 4px}
  .seg{fill:none;stroke-width:15;stroke-linecap:butt}
  .gnum{font-family:var(--sans);font-size:46px;font-weight:640;letter-spacing:-.03em;fill:var(--ink)}
  .gpct{font-size:20px;font-weight:500;fill:var(--soft)}
  .linkbtn{display:block;width:100%;background:none;border:none;color:var(--soft);
    font-size:.85rem;padding:10px;margin-top:2px}
  .linkbtn:hover{color:var(--green-d)}
  .story{font-size:1.05rem;line-height:1.75}
  .story b{font-weight:620;background:#E4EDE9;padding:0 3px;border-radius:2px}
  .pick{text-align:left;padding:13px 16px}
  .pick small{display:block;font-weight:400;color:var(--soft);font-size:.8rem;margin-top:2px}
  .item{padding:14px 16px}
  .ihead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .ihead b{font-size:1.15rem;font-weight:620;letter-spacing:-.02em}
  .ipos{color:var(--soft);font-size:.85rem}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .dot.started{background:var(--red)}
  .dot.read{background:var(--amber)}
  .dot.known{background:var(--green)}
  .key{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;
    margin:-2px 0 18px;font-size:.82rem;color:var(--soft)}
  .key span{display:flex;align-items:center;gap:6px}
  .key b{font-weight:560;color:var(--ink);font-variant-numeric:tabular-nums}
  .say.tiny{margin:0 0 0 auto;padding:3px 9px;font-size:.8rem}
  .idef{font-size:.97rem;margin-bottom:8px}
  .fb{padding:10px 12px;border-radius:4px;margin-bottom:12px;font-size:.95rem}
  .fb.ok{background:#EEF5F3;border-left:3px solid var(--green)}
  .fb.no{background:#FBEFEE;border-left:3px solid var(--red)}
  a{color:var(--green-d)}
</style>
</head>

["shallow","adj","not deep; the bottom is close to the surface","The children played in the {shallow} end of the pool.","deep"],

["anxious","adj","worried about something that may happen","She felt {anxious} before the interview.","calm"],

const STORIES=[{"t": "The Well","s": "My grandmother's well was old, and the water in it was {shallow}. Every morning she carried two buckets up to the house herself. She was {stubborn}: she never let me help, not even when her hands began to {tremble} on the handle. One July morning I took a bucket while she was inside. I walked five steps and {spilled} half of it over my shoes. She saw everything from the window and said nothing. That evening she gave me the biggest piece of bread on the table. I was {greedy} and finished it in a minute, then asked for more. 'Tomorrow you carry the water,' she said, 'and then we will see how hungry you are.'","q": [{"q": "The water was shallow. That means it was","o": ["not deep","not clean","very cold","very far below"]},{"q": "Which sentence shows that she was stubborn?","o": ["She never let him help, even when her hands shook","She gave him the biggest piece of bread","She watched him from the window","She said nothing that evening"]}]},{"t": "Leaving","s": "Our house was {ancient} — older than the road, older than the church at the end of it. In winter the garden stood {bare}: black branches, snow, nothing else. My grandmother stayed {cheerful} anyway and sang while she cooked. In March the wind was {fierce}, and in one second it could {scatter} a whole pile of dry leaves across the yard. On my last evening I sat on the step and looked at that yard for a long time. In the morning I took one bag to the bus. She did not cry. She only said, 'Call me on Sundays.'","q": [{"q": "In winter the garden was bare. There was","o": ["nothing growing on it","deep snow in one corner only","a lot of fruit","a new fence"]},{"q": "The wind would scatter the leaves. It","o": ["threw them in all directions","made them wet","burned them","gathered them in one place"]}]},{"t": "My Uncle's Garage","s": "My uncle Petro died in April, and my father asked me to help clean out his garage. The door was {rusty} and would not move until we pulled it together. Inside, the air was cold and {damp}. I knocked on a tall cupboard and it sounded {hollow} — there was nothing in it at all. I was {clumsy} that day: I dropped a whole box of screws onto the concrete. My father never spoke about his {grief}. He worked all afternoon, and then sat in the car for ten minutes with the door open, saying nothing.","q": [{"q": "The cupboard sounded hollow. That means","o": ["it was empty inside","it was full of tools","it was made of stone","it was locked"]},{"q": "What did the father do with his grief?","o": ["He said nothing about it and worked instead","He talked about it all day","He shouted at his son","He went home early"]}]},{"t": "A Promise","s": "By evening we were {weary} and grey with dust, so we went out to {stroll} along the empty street. My cousin Andriy began to {mock} my plan to work abroad. 'You? You will be back in a month.' My father answered him with one {blunt} sentence: 'Let him try.' Then he turned to me and asked if I was serious. That night I made a {vow} to myself, quietly: two years, and money home every month. I have kept half of that promise well and half of it badly.","q": [{"q": "Andriy began to mock his plan. He","o": ["laughed at it in an unkind way","asked careful questions about it","agreed with it","wrote it down"]},{"q": "'Let him try' was a blunt sentence. It was","o": ["short and direct","long and polite","angry and loud","meant as a joke"]}]},{"t": "Arrival","s": "The airport was full. I stood in a {crowd} of people for two hours with one bag against my leg. Outside, a man began to {whistle} for a taxi; I copied him, and it worked. My first room had a bed, a window and one {shelf}. In the evening the building next door threw a long {shadow} across the floor, and the room went dark before the sky did. I called my grandmother and told her everything was fine. I felt {guilty} saying it, because the room was cold and I had eaten only bread that day.","q": [{"q": "The building threw a long shadow. A shadow is","o": ["the dark shape where something blocks the light","a kind of narrow window","a cold wind between houses","a mark on the floor"]},{"q": "Why did he feel guilty?","o": ["He told his grandmother things were fine when they were not","He had forgotten to call her","He had lost his bag","He had spent all his money"]}]},{"t": "The First Month","s": "I had to {borrow} a blanket from the man in the next room. His name was Marek. He had a {spare} kettle as well and gave it to me for nothing. I kept my room very {tidy}, because when you own five things, mess is a decision. At night I would {curl} up under that blanket and read old messages from home. Sometimes I had to {swallow} something hard in my throat before I could answer them. By morning I was always fine again.","q": [{"q": "He had to borrow a blanket. He","o": ["took it and would give it back later","bought it from Marek","found it in the street","was given it to keep"]},{"q": "Marek's kettle was spare. It was","o": ["an extra one he did not need","broken","the only one he had","very expensive"]}]},{"t": "Moving Furniture","s": "My first job was moving furniture. Marek showed me how to {wrap} a fridge in a blanket before you touch it. The doors in old buildings are narrow, so you {squeeze} everything through them slowly, centimetre by centimetre. 'Never lift with your back,' he said. '{Lean} it, then walk it.' I had to {stretch} my arms high to hold the top corner, because he was taller than me. My gloves {shrank} after the first rain and never fitted again. I kept them anyway for a year.","q": [{"q": "Why do you wrap a fridge before moving it?","o": ["To protect it while it is carried","To make it lighter","To keep the food cold","To measure it"]},{"q": "'Lean it, then walk it.' Lean means","o": ["tip it back and rest it at an angle","lift it above your head","push it as fast as you can","turn it upside down"]}]},{"t": "Hard Days","s": "Some days were nothing but stairs. You cannot {drag} a heavy box across a wooden floor; you lift it, and your hands go red. One morning I saw a long {crack} in the wall of a house we were emptying, and it made me think of my grandmother's kitchen. The roads in that district were {rough}, and the cart jumped on every stone. Marek always told me to keep the load {steady}. In the evening I would sit on the step and {rub} my shoulders before walking home.","q": [{"q": "You cannot drag a heavy box on that floor. Drag means","o": ["pull it along the ground","carry it on your shoulder","throw it down","lift it with two people"]},{"q": "The roads were rough. They were","o": ["not smooth","very narrow","closed for repairs","very busy"]}]},{"t": "The New Site","s": "After eight months I got work on a building site. The foreman was called Dave. He was {strict} but never {rude} — the difference between those two words took me a year to understand properly. On my first day he checked my helmet and found the strap too {loose}. He pulled it {tight} himself. I was {eager} to show that I could work fast, so I carried two pipes where everyone else carried one. He watched me and said only this: 'Slower. You are here for years, not for today.'","q": [{"q": "He was strict but never rude. That means he","o": ["demanded the rules but was not impolite","shouted at everyone","ignored the safety rules","never spoke to anyone"]},{"q": "Why did Dave tell him to work slower?","o": ["Because the job would last for years","Because the pipes were expensive","Because he had arrived late","Because it was raining"]}]},{"t": "Fear","s": "For the first months I was {anxious} every single morning. My English was poor, and every question I had to ask felt like a {burden} for the person answering it. Once I misunderstood an instruction and cut a pipe too short. I felt {shame} for two days and slept badly. There was no {threat} of losing the job; Dave simply showed me again, slowly, with his hands. At the end of that week he gave me a small {reward}: I could choose the music in the van. It sounds like nothing. For me it meant that I belonged.","q": [{"q": "Every question felt like a burden. Asking felt","o": ["heavy and difficult","quick and easy","funny","completely normal"]},{"q": "What was the reward at the end of the week?","o": ["He could choose the music in the van","Extra money","A free day","A new helmet"]}]},{"t": "The Roof","s": "In June we worked on a roof. There was a {pile} of brackets by the door and a narrow {gap} between two pipes that I had to reach through. Without thinking, I stepped too close to the {edge}. Dave came over to {warn} me, and his voice was not the voice he used for anything else. That evening he asked if I had been frightened. I wanted to say no. Instead I chose to {admit} it: yes, for one second. He nodded and said the day you stop being frightened up there is the day you should go home.","q": [{"q": "He stepped too close to the edge. The edge is","o": ["the outer border, where the roof ends","the middle of the roof","the door to the stairs","the top of the ladder"]},{"q": "He decided to admit that he had been frightened. He","o": ["agreed it was true, although it was hard to say","said it was not true","forgot about it","made a joke about it"]}]},{"t": "The Missing Part","s": "On Friday the last bracket disappeared. Every man on the floor would {deny} taking it. I did not want to {avoid} the problem, and we could not {delay} the job until Monday, so I decided to {replace} the missing part with a temporary one and {attach} it with two extra bolts. It held all weekend. On Monday the right bracket arrived and I changed it before lunch. Dave never mentioned any of it, but after that week he began giving me my own tasks.","q": [{"q": "Everyone would deny taking it. They","o": ["said that they had not taken it","said sorry for taking it","paid for a new one","brought it back quietly"]},{"q": "What did he do instead of delaying the job?","o": ["He fitted a temporary part with extra bolts","He waited until Monday","He left the gap open","He went home early"]}]},{"t": "Money and English","s": "That winter I could not {afford} a teacher. I had to {reduce} everything: no taxis, no restaurants, one coffee a week. But I wanted my English to {improve} faster than my savings grew. I learned that you cannot {rely} on luck, or on the idea that a language arrives by itself if you live in the country. It comes from the same twenty minutes every evening, when you are tired and it is the last thing you want to do. Nobody {deserves} a language. You only build one.","q": [{"q": "He could not afford a teacher. He","o": ["did not have enough money for one","did not want one","had no time for one","did not know any teachers"]},{"q": "'You cannot rely on luck.' You cannot","o": ["depend on it","understand it","find it","explain it"]}]},{"t": "Twenty Minutes","s": "My first {attempt} was thirty minutes a day, and it lasted four days. The second one lasted longer. I would {struggle} with long words and {hesitate} before speaking to anyone in a shop. My worst habit was this: I would {pretend} that I had understood, smile, and walk away with nothing. I {suppose} a lot of people do the same. The day I started saying 'Sorry, what does that word mean?' my English changed more than in the three months before it.","q": [{"q": "He would pretend that he had understood. He","o": ["acted as if it were true when it was not","asked for help at once","repeated the word","wrote the word down"]},{"q": "He would hesitate before speaking in a shop. He","o": ["paused because he was not sure","spoke very loudly","walked out immediately","smiled and nodded"]}]},{"t": "Winter","s": "In January it went dark at four. I {rarely} went out. That month I had {barely} enough money for the rent, and I did not tell my grandmother. But something was changing {gradually}, under everything. One evening I noticed that I had watched a whole film without subtitles and followed most of it. My accent was still strong then, and it is {slightly} strong even now. {Eventually} I stopped counting my mistakes and started counting my conversations instead.","q": [{"q": "He had barely enough money for the rent. He had","o": ["only just enough","far too much","none at all","exactly double"]},{"q": "Something was changing gradually. It changed","o": ["slowly, little by little","in a single day","suddenly, one morning","not at all"]}]},{"t": "The Phone Call","s": "In March Dave asked me to call a supplier. I said yes, and then sat with the phone in my hand for {roughly} ten minutes. My fear was {mainly} about speed: people speak fast on the telephone, and {therefore} I would lose the middle of every sentence. {Besides}, you cannot see a face down a phone line. I made the call. It was {indeed} difficult, and I asked the man to repeat himself twice. But I got the delivery date, and I wrote it down correctly.","q": [{"q": "He sat with the phone for roughly ten minutes. Roughly means","o": ["about, not exactly","exactly","less than one","more than an hour"]},{"q": "'Besides, you cannot see a face.' Besides means","o": ["in addition","however","because of that","luckily"]}]},{"t": "Rain on Friday","s": "Our {crew} started the {shift} at six thirty. It rained all morning, so we ate under a plastic {shelter} beside the trucks. Halfway up the wall I found water running down from the floor above — a {leak} that nobody had reported. When I touched the switch, a small {spark} jumped out and the lights went off. Nobody was hurt. We stopped, called the electrician and waited two hours. It was a slow day, but the boss bought everyone coffee, and Marek told the story all week.","q": [{"q": "They ate under a shelter. The shelter","o": ["kept the rain off them","was their lunch","was a kind of tool","held up the pipes"]},{"q": "What was the leak?","o": ["Water escaping from the floor above","A hole in the truck roof","A broken switch","A crack in the road"]}]},{"t": "My Own Tools","s": "With my third {wage} that he shreds of rotted blankets John Thornton found a long-barrelled flint-lock.","w":[5],"m":["ancient"],"src":"The Call of the Wild — Jack London"},{"s":"The whole front was draped in ivy, with a patch clipped {bare} here and there where a window or a coat of arms broke through the dark veil. From this central block rose the twin towers, {ancient}, crenelated, and pierced with many loopholes.","w":[5,6],"m":["ancient","bare"],"src":"The Hound of the Baskervilles — A. Conan Doyle"},{"s":"The dog at the gate looked {fierce}, but it was old and chained. When the postman came it barked so hard that the birds {scattered} off the roof. My little cousin used to {tremble} at the sound of it. Now she feeds it bread through the fence every morning.","w":[2,8,9],"m":["tremble","scattered","fierce"],"src":""},{"s":"The room I rented had {bare} walls and one small window. I bought a yellow cloth for the table because I could not afford anything else, and it made the whole place look {cheerful}. Small things do that when you own nothing.","w":[6,7],"m":["bare","cheerful"],"src":""},{"s":"The olive tree behind the house is {ancient} — my grandfather said it was already big when he was a boy. Every autumn we picked from it, and every autumn my uncle wanted the whole crop for himself. He was {greedy}, but nobody argued, because the tree kept giving.","w":[4,5],"m":["greedy","ancient"],"src":""},{"s":"He had walked a long way and it had not lifted his. But at last he had felt tired and had thrown himself down to rest on a carpet of moss by a stream. It was a clear little stream which ran quite merrily along on its narrow way through the luscious {damp} greenness.","w":[11],"m":["damp"],"src":"The Secret Garden — F. H. Burnett"},{"s":"But the pretty milkmaid was much too vexed to make any answer. She picked up the leg sulkily and led her cow away, the poor animal limping on three legs. As she left them the milkmaid cast many reproachful glances over her shoulder at the {clumsy} strangers, holding her nicked elbow close to her side.","w":[12],"m":["clumsy"],"src":"The Wonderful Wizard of Oz — L. Frank Baum"},{"s":"The gate had not been opened for years. It was {rusty} at the hinges and it screamed when we pushed it. Behind it stood an iron barrel; I knocked on the side and the sound was {hollow}, so we knew it was empty and rolled it out of the way.","w":[10,13],"m":["hollow","rusty"],"src":""},{"s":"After the funeral the house stayed cold and {damp} for weeks, because nobody thought to light the stove. My mother's {grief} was a quiet one. She cooked, she washed, she answered questions — and then once, in the middle of a Tuesday, she sat down on the kitchen floor and stayed there.","w":[11,14],"m":["damp","grief"],"src":""},{"s":"I am {clumsy} in other people's kitchens. I do not know where anything lives, so I open the wrong door, reach across the wrong hand, and {spill} the milk on somebody else's clean table. At home I never break a thing.","w":[3,12],"m":["spill","clumsy"],"src":""},{"s":"The man was elderly and infirm. We can understand his taking an evening {stroll}, but the ground was {damp} and the night inclement.","w":[11,15],"m":["damp","stroll"],"src":"The Hound of the Baskervilles — A. Conan Doyle"},{"s":"The following evening the Mole, who had risen late and taken things very easy all day, was sitting on the bank fishing, when the Rat, who had been looking up his friends and gossiping, came {strolling} along to find him. \"Heard the news?\" he said.","w":[15],"m":["strolling"],"src":"The Wind in the Willows — Kenneth Grahame"},{"s":"By eight o'clock we were {weary} and nobody wanted to talk. Then Marek started to {mock} the way the new foreman walks — the shoulders, the little steps — and even the quiet men laughed until they had to hold on to the table. We forgot how tired we were for ten minutes.","w":[17,19],"m":["weary","mock"],"src":""},{"s":"My father was a {blunt} man. He did not say 'perhaps' or 'we shall see'; he said yes or by the station has one {shelf} of bread and nothing else worth buying, but at seven in the morning there is a {crowd} inside it. Everybody who starts work at eight stops there, and everybody buys the same thing.","w":[20,22],"m":["shelf","crowd"],"src":""},{"s":"Two gentlemen who were in the lavatory at the time tried to lift him up: but he was quite helpless. He lay {curled} up at the foot of the stairs down which he had fallen. They succeeded in turning him over. His hat had rolled a few yards away and his clothes were smeared with the filth and ooze of the floor on which he had lain, face downwards.","w":[26],"m":["curled"],"src":"Dubliners — James Joyce"},{"s":"Marek had a {spare} kettle that he never used, and he gave it to me without being asked. Two weeks later I had to {borrow} his iron as well. He said the only rule in that building was that you give a thing back better than you took it.","w":[25,27],"m":["borrow","spare"],"src":""},{"s":"My room is {tidy} because it is small. One {shelf}, one chair, one bag under the bed. When you own five things, mess is a decision and not an accident. I met men in that building who had lived there eleven years and never unpacked.","w":[20,28],"m":["shelf","tidy"],"src":""},{"s":"The pills were too big and the water was warm. I had to {swallow} twice and it still felt like a stone going down. Outside the window the morning was grey and {damp}, and I sat on the edge of the bed for a minute before I could stand up.","w":[11,29],"m":["damp","swallow"],"src":""},{"s":"Before them was a great {stretch} of country having a floor as smooth and shining and white as the bottom of a big platter. {Scattered} around were many houses made entirely of china and painted in the brightest colors. These houses were quite small, the biggest of them reaching only as high as Dorothy's waist. There were also pretty little barns, with china fences around them; and many cows and sheep and horses and pigs and chickens, all made of china, were standing about in groups.","w":[8,34],"m":["Scattered","stretch"],"src":"The Wonderful Wizard of Oz — L. Frank Baum"},{"s":"So he set down on the ground betwixt me and Tom. He {leaned} his back up against a tree, and {stretched} his legs out till one of them most touched one of mine. My nose begun to itch. It itched till the tears come into my eyes.","w":[32,34],"m":["leaned","stretched"],"src":"Huckleberry Finn — Mark Twain"},{"s":"You {wrap} a mirror in two blankets, never one. Then two men lift it and a third watches the door, because the doors in old buildings are narrow and you have to {squeeze} everything through them centimetre by centimetre.","w":[30,31],"m":["wrap","squeeze"],"src":""},{"s":"My work gloves got wet in October and {shrank} on the radiator overnight. By morning they would have fitted a child. I {wrapped} my hands in tape instead and worked like that for two days, until the shop opened on the Monday.","w":[30,33],"m":["wrapped","shrank"],"src":""},{"s":"'Never lift with your back,' Marek said. '{Lean} it, then walk it.' To hold the top corner I had to {stretch} my arms above my head, because he was taller than me and would not bend his knees for anybody.","w":[32,34],"m":["Lean","stretch"],"src":""},{"s":"The man from the West unfolded the little piece of paper handed him. His hand was {steady} when he began to read, but it {trembled} a little by the time he had finished. The note was rather short.","w":[2,38],"m":["trembled","steady"],"src":"The Four Million — O. Henry"},{"s":"Dickon began to push the wheeled chair slowly and {steadily}. Mistress Mary walked beside it and Colin {leaned} back and lifted his face to the sky.","w":[32,38],"m":["leaned","steadily"],"src":"The Secret Garden — F. H. Burnett"},{"s":"You cannot {drag} a wardrobe across a wooden floor — it leaves two grey lines that nobody can clean afterwards. The yard outside was {rough} with broken stones, so we carried it out there as well, and my hands were red for the rest of the day.","w":[35,39],"m":["drag","rough"],"src":""},{"s":"There was a {crack} in the wall of the flat we were emptying, running from the floor up to the window. I {rubbed} it with my thumb and old paint came away as dust. It made me think of my grandmother's kitchen, which had the same line in the same place.","w":[36,37],"m":["crack","rubbed"],"src":""},{"s":"'Hold the light {steady},' Dave said, and I tried, but after four hours my arm shook anyway. In the end he put the lamp down on a box, and we {dragged} the box along the wall as we moved.","w":[35,38],"m":["dragged","steady"],"src":""},{"s":"In the meantime the astonished team-dogs had burst out of their nests only to be set upon by the {fierce} invaders. Never had Buck seen such dogs. It seemed as though their bones would burst through their skins. They were mere skeletons, draped {loosely} in draggled hides, with blazing eyes and slavered fangs.","w":[9,41],"m":["fierce","loosely"],"src":"The Call of the Wild — Jack London"},{"s":"Dave was {strict} about time. Six thirty meant six twenty-five with your boots already on. I was so {eager} to show him that I was serious that for a whole month I arrived at six and sat alone in the van in the dark, feeling clever.","w":[42,44],"m":["strict","eager"],"src":""},{"s":"He checked my helmet before he checked anything else. The strap was {loose}, so he pulled it {tight} himself, hard enough that I felt it under my chin. 'If it is comfortable,' he said, 'it is wrong.'","w":[40,41],"m":["tight","loose"],"src":""},{"s":"There is a difference between {blunt} and {rude}, and it took me a year to hear it. Dave would say 'no, do that again' with no soft words around it, and that is not {rude}. The man who never learned my name in eight months — that was something else.","w":[18,43],"m":["blunt","rude"],"src":""},{"s":"\"Don't go. Are you afraid of me, Margaret?\" and Mr. Brooke looked so hurt that Meg thought she must have done something very {rude}. She blushed up to the little {curls} on her forehead, for he had never called her Margaret before, and she was surprised to find how natural and sweet it seemed to hear him say it. {Anxious} to appear friendly and at her ease, she put out her hand with a confiding gesture, and said gratefully...","w":[26,43,45],"m":["curls","rude","Anxious"],"src":"Little Women — Louisa May Alcott"},{"s":"For the first months I was {anxious} every morning before I had even opened my eyes. Not about the work — about the small things: the bus, the {crowd} at the door, the question somebody might ask me that I would not understand.","w":[22,45],"m":["crowd","anxious"],"src":""},{"s":"At the end of a bad week Dave gave me a {reward} that cost him nothing: I could choose the music in the van. It sounds like a joke. But my hands were {steady} that Friday for the first time in a month, and I knew exactly why.","w":[38,46],"m":["steady","reward"],"src":""},{"s":"Rain was the only real {threat} to the schedule. Three wet days together and the whole floor stayed {damp}, and nothing could be painted, and we sat in the van reading the same newspaper until somebody sent us home.","w":[11,47],"m":["damp","threat"],"src":""},{"s":"I cut a pipe forty centimetres too short because I misheard one number. Nobody shouted, which was worse. The {shame} sat with me for two days, and I felt {guilty} every time somebody walked past that wall.","w":[21,48],"m":["guilty","shame"],"src":""},{"s":"Every question I had to ask felt like a {burden} for the person answering it. That is the wrong way to think and it cost me six months of English. People are not carrying you when they explain a word to you. They are just talking.","w":[49],"m":["burden"],"src":""},{"s":"There was a {pile} of brackets by the door and I stepped back to count them without looking behind me. That put me half a metre from the {edge} of the roof. Dave did not shout. He said my name once, in a voice I had not heard him use before.","w":[50,51],"m":["edge","pile"],"src":""},{"s":"'Leave a small {gap} between the boards,' the old carpenter told me. 'Wood moves.' Nobody had {warned} me about that on my first job, and by August the floor I had laid in April stood up in the middle like a wave.","w":[52,53],"m":["gap","warned"],"src":""},{"s":"He asked me afterwards whether I had been frightened up there. I wanted to say no. Instead I chose to {admit} it — yes, for one second — and there was no {shame} in it at all. He said the day you stop being frightened is the day you should go home.","w":[48,54],"m":["shame","admit"],"src":""},{"s":"Round a bend in the canal came plodding a solitary horse, stooping forward as if in {anxious} thought. From rope traces {attached} to his collar {stretched} a long line, taut, but dipping with his stride, the further part of it dripping pearly drops. Toad let the horse pass, and stood waiting for what the fates were sending him.","w":[34,45,58],"m":["stretched","anxious","attached"],"src":"The Wind in the Willows — Kenneth Grahame"},{"s":"Again the rope was {attached} and he was launched, and again he struck out, but this time straight into the stream. He had miscalculated once, but he would not be {guilty} of it a second time. Hans paid out the rope, permitting no slack, while Pete kept it clear of coils. Buck held on till he was on a line straight above Thornton; then he turned, and with the speed of an express train headed down upon him.","w":[21,58],"m":["guilty","attached"],"src":"The Call of the Wild — Jack London"},{"s":"The last bracket disappeared on a Friday and every man on the floor would {deny} taking it. I do not think anybody was lying. Things fall into buckets, into bags, into vans. But nobody wanted to {admit} that he had not been watching.","w":[54,55],"m":["admit","deny"],"src":""},{"s":"We could not {delay} the job until Monday, so I decided to {replace} the missing part with a temporary one and fix it with two extra bolts. It held all weekend. On Monday the right bracket arrived and I changed it before lunch.","w":[57,59],"m":["delay","replace"],"src":""},{"s":"{Attach} the bracket to the wall first, then hang the pipe — never the other way round. Do it backwards once and you will {avoid} that mistake for the rest of your life, because you will spend an afternoon holding twelve kilos above your head.","w":[56,58],"m":["avoid","Attach"],"src":""},{"s":"I met her several times out in the country, going a good {steady} pace, and looking as gay and contented as a horse could be. I was very glad to see her, for she {deserved} a good place.","w":[38,64],"m":["steady","deserved"],"src":"Black Beauty — Anna Sewell"},{"s":"\"This hat is three years old. These flat brims {curled} at the {edge} came in then. It is a hat of the very best quality. Look at the band of ribbed silk and the excellent lining. If this man could {afford} to buy so expensive a hat three years ago, and has had no hat since, then he has assuredly gone down in the world.\"","w":[26,50,63],"m":["curled","edge","afford"],"src":"The Adventures of Sherlock Holmes — A. Conan Doyle"},{"s":"My English did not {improve} because I was living in the country. It improved on the evenings when I was tired and did the twenty minutes anyway. You cannot {rely} on a language arriving by itself. Nobody is bringing it to you.","w":[60,62],"m":["improve","rely"],"src":""},{"s":"That winter I could not {afford} a teacher, so I had to {reduce} everything else: no taxis, one coffee a week, shoes repaired instead of replaced. I wanted my English to grow faster than my savings, and for four months it did.","w":[61,63],"m":["reduce","afford"],"src":""},{"s":"After a fourteen-hour day my grandmother would have said that you {deserve} a rest, and she would have been right. But those are exactly the evenings that made anything {improve} at all. The easy days taught me nothing whatsoever.","w":[60,64],"m":["improve","deserve"],"src":""},{"s":"It filled and sank, and Toad found himself {struggling} in deep water. Looking up, he saw two stoats {leaning} over the parapet of the bridge and watching him with great glee. \"It will be your head next time, Toady!\" they called out to him. The indignant Toad swam to shore, while the stoats laughed and laughed, supporting each other, and laughed again, till they nearly had two fits—that is, one fit each, of course.","w":[32,68],"m":["leaning","struggling"],"src":"The Wind in the Willows — Kenneth Grahame"},{"s":"My worst habit was this one: I would {pretend} that I had understood, smile, and walk away with nothing. I {suppose} half the people in that city were doing exactly the same thing in a different language.","w":[65,66],"m":["pretend","suppose"],"src":""},{"s":"My first {attempt} at the telephone was a failure — I {hesitated} so long that the man at the other end said hello three times and put the phone down. The second attempt came two days later. I wrote the first sentence on paper before I dialled.","w":[67,69],"m":["hesitated","attempt"],"src":""},{"s":"I {struggled} with long words for two years. Not with the meaning — with the mouth. And a man who cannot say a word properly begins to {pretend} that he does not need it, and then his English stops growing where his courage stopped.","w":[65,68],"m":["pretend","struggled"],"src":""},{"s":"Uncle Henry never laughed. He worked hard from morning till night and did not know what joy was. He was gray also, from his long beard to his {rough} boots, and he looked stern and solemn, and {rarely} spoke.","w":[39,70],"m":["rough","rarely"],"src":"The Wonderful Wizard of Oz — L. Frank Baum"},{"s":"Like his mates, he was {barely} able to get up, but, unlike them, he had made up his mind not to get up. He had a vague feeling of impending doom. This had been strong upon him when he pulled in to the bank, and it had not departed from him. What of the thin and rotten ice he had felt under his feet all day, it seemed that he sensed disaster close at hand, out there ahead on the ice where his master was trying to drive him.","w":[71],"m":["barely"],"src":"The Call of the Wild — Jack London"},{"s":"My uncle {rarely} left the village — four times in forty years, he said, and twice of those for funerals. {Eventually} he came to visit me, took one look at the traffic outside the station, and said he understood now why I telephoned on Sundays instead of writing.","w":[70,72],"m":["rarely","Eventually"],"src":""},{"s":"In January I {barely} had enough money for the rent and I did not tell my grandmother. But something was changing {gradually}, underneath everything. One evening I watched a whole film without subtitles and followed most of it, and I had not even been trying.","w":[71,73],"m":["barely","gradually"],"src":""},{"s":"The pipe was {slightly} bent — you could not see it, you could only feel it with your hand. I showed Dave and he held it up to the light and found a hair-thin {crack} at the bend. 'Small things,' he said, and dropped it in the bin.","w":[36,74],"m":["crack","slightly"],"src":""},{"s":"About halfway across the heath there had been a wide dike recently cut, and the earth from the cutting was cast up {roughly} on the other side. Surely this would stop them! But no; with scarcely a pause Lizzie took the leap, stumbled among the {rough} clods and fell. Blantyre groaned, \"Now, Auster, do your best!\" He gave me a steady rein.","w":[39,75],"m":["rough","roughly"],"src":"Black Beauty — Anna Sewell"},{"s":"It was a very strange thing {indeed}. She quite caught her breath as she stopped to look at it. A boy was sitting under a tree, with his back against it, playing on a {rough} wooden pipe.","w":[39,78],"m":["rough","indeed"],"src":"The Secret Garden — F. H. Burnett"},{"s":"The job is {mainly} indoor work in winter, and {therefore} the winter men stay and the summer men leave. That is the whole economics of the trade, Dave said, and it explains why he never trusts anybody in his first June.","w":[76,79],"m":["mainly","therefore"],"src":""},{"s":"It costs {roughly} two hundred for the part, and {besides} that you lose a day waiting for it to arrive. Which is why the old men keep everything: a shelf of broken taps that will save them one Tuesday in five years.","w":[75,77],"m":["roughly","besides"],"src":""},{"s":"The call was {indeed} difficult. I asked the man to repeat himself twice and my voice was {slightly} too loud, the way it goes when you are frightened. But I got the delivery date, and I wrote it down correctly, and that was the whole job.","w":[74,78],"m":["slightly","indeed"],"src":""},{"s":"The room was silent again. Then a bustling little man with a snuffling nose and very cold ears pushed in the door. He walked over quickly to the fire, {rubbing} his hands as if he intended to produce a {spark} from them.","w":[37,82],"m":["rubbing","spark"],"src":"Dubliners — James Joyce"},{"s":"The flat began to {leak}. In a very few moments it was necessary for Elaine to scramble to her feet, pick up her cloth of gold coverlet and pall of blackest samite and gaze blankly at a big crack in the bottom of her barge through which the water was literally pouring. That sharp stake at the landing had torn off the strip of batting nailed on the flat. Anne did not know this, but it did not take her long to realize that she was in a dangerous plight.","w":[81],"m":["leak"],"src":"Anne of Green Gables — L. M. Montgomery"},{"s":"It rained all morning, so the {crew} ate under a plastic {shelter} beside the trucks. Eight men, one bench, and a radio that nobody was listening to. Those forty minutes are the part I miss now that I have an office.","w":[80,83],"m":["shelter","crew"],"src":""},{"s":"Halfway up the wall I found water running down from the floor above — a {leak} that nobody had reported. When I touched the switch a small {spark} jumped out and the lights went off along the whole corridor. Nobody was hurt, and Marek told the story all week.","w":[81,82],"m":["leak","spark"],"src":""},{"s":"Our {crew} starts the {shift} at six thirty, which means the alarm goes at five. For the first year I hated that hour. Now it is the only part of the day when nobody wants anything from me.","w":[83,84],"m":["crew","shift"],"src":""},{"s":"Anne turned pale, but there was clearly only one thing to be done. She walked toward the house, where a {ladder} was {leaning} against the kitchen roof. All the fifth-class girls said, \"Oh!\" partly in excitement, partly in dismay.","w":[32,86],"m":["leaning","ladder"],"src":"Anne of Green Gables — L. M. Montgomery"},{"s":"It looked {clumsy}, but the Tin Woodman was sure it was strong and would answer their purpose. The Scarecrow waked Dorothy and the Lion and Toto, and told them that the {ladder} was ready. The Scarecrow climbed up the ladder first, but he was so awkward that Dorothy had to follow close behind and keep him from falling off. When he got his head over the top of the wall the Scarecrow said, \"Oh, my!\"","w":[12,86],"m":["clumsy","ladder"],"src":"The Wonderful Wizard of Oz — L. Frank Baum"},{"s":"The first {wage} covered the rent and the food and nothing else at all. The second one covered the rent, the food and a phone card. I remember counting it on the bed after a night {shift}, in coins, twice, to be sure of it.","w":[84,85],"m":["shift","wage"],"src":""},{"s":"With my third wage I bought my own {drill}. Then a measuring {tape}, then a box with every {bolt} I used most often, sorted by size. A man who arrives with his own tools is a different man on a site, and everybody there knows it.","w":[87,88,89],"m":["bolt","drill","tape"],"src":""},{"s":"'Hold the {ladder} steady,' I said, and then I said it again, louder. I was three metres up with a {bolt} between my teeth and a man below me who was looking at his telephone. That is how people fall.","w":[86,87],"m":["ladder","bolt"],"src":""},{"s":"\"Dear, kind Rat,\" murmured Toad, \"how little you {realise} my condition, and how very far I am from 'jumping up' now—if ever! But do not trouble about me. I hate being a {burden} to my friends, and I do not {expect} to be one much longer. {Indeed}, I almost hope not.\"","w":[49,78,91,94],"m":["burden","Indeed","realise","expect"],"src":"The Wind in the Willows — Kenneth Grahame"},{"s":"I {realised} it as I drove back and noted how hill after hill showed traces of the {ancient} people. Barrymore's only indication had been that the stranger lived in one of these abandoned huts, and many hundreds of them are {scattered} throughout the length and breadth of the moor. But I had my own experience for a guide since it had shown me the man himself standing upon the summit of the Black Tor. That, then, should be the centre of my search.","w":[5,8,91],"m":["ancient","scattered","realised"],"src":"The Hound of the Baskervilles — A. Conan Doyle"},{"s":"'Did you {notice} the {crack} above that door?' Dave asked, and I had not. He walked me back and made me stand under it for a minute without saying anything. After that I saw cracks everywhere for a month, in buildings that were perfectly sound.","w":[36,92],"m":["crack","notice"],"src":""},{"s":"Last spring a client rang and I did not {recognise} his voice. He was angry about a delay, and as he talked I began to {realise} that the mistake was not ours. I asked him to look at page four of the drawings again, and he went very quiet.","w":[91,93],"m":["realise","recognise"],"src":""},{"s":"He offered me a small crew of my own in July. I said I would {consider} it for a week, which was not what he {expected} — most men say yes in the room. I telephoned my grandmother instead, and she asked whether I was eating properly.","w":[90,94],"m":["consider","expected"],"src":""},{"s":"Men gasped and began to breathe again, unaware that for a moment they had ceased to breathe. Thornton was running behind, {encouraging} Buck with short, cheery words. The distance had been measured off, and as he neared the {pile} of firewood which marked the end of the hundred yards, a cheer began to grow and grow, which burst into a roar as he passed the firewood and halted at command. Every man was tearing himself loose, even Matthewson. Hats and mittens were flying in the air.","w":[51,98],"m":["pile","encouraging"],"src":"The Call of the Wild — Jack London"},{"s":"I can never do that,\" said Anne determinedly and darkly. \"You can punish me in any way you like, Marilla. You can shut me up in a dark, {damp} dungeon inhabited by snakes and toads and feed me only on bread and water and I shall not {complain}. But I cannot ask Mrs.","w":[11,96],"m":["damp","complain"],"src":"Anne of Green Gables — L. M. Montgomery"},{"s":"Your father, Jo. He never loses patience, never doubts or {complains}, but always hopes, and works and waits so {cheerfully} that one is ashamed to do otherwise before him. He helped and comforted me, and showed me that I must try to practice all the virtues I would have my little girls possess, for I was their example. It was easier to try for your sakes than for my own.","w":[7,96],"m":["cheerfully","complains"],"src":"Little Women — Louisa May Alcott"},{"s":"The men on my crew {complain} about exactly the things I used to {complain} about, and some weeks I have to {apologise} for a decision I got wrong. Nobody warned me that this would be most of the job.","w":[96,97],"m":["complain","apologise"],"src":""},{"s":"Anyone who stays calm on a telephone will {achieve} more than a fast worker who shouts. Dave said that once, about me, when he did not know that I could hear him. It was the first thing I ever {achieved} in that country that had nothing to do with my hands.","w":[99],"m":["achieve"],"src":""},{"s":"He did not {encourage} people often, so the sentence stayed with me. I would still {prefer} the mornings when nobody speaks to me before seven — but I have a crew of my own now, and a crew talks.","w":[95,98],"m":["prefer","encourage"],"src":""}];

// intervals in days; spacing itself is what the research supports
const STEPS=[1,3,7,16,35,90];
const KEY="vocab-progress";
let P={words:{},log:{},streak:0,last:null,rw:{},read:{}};
let view="home",queue=[],qi=0,shown=false,session={right:0,wrong:0,mode:""};
let sn=0,sq=0,sright=0,sopts=null;   // story-chapter state
let rp=-1,rqs=[],rq=0,rright=0,ropts=null;  // random-passage state

const app=document.getElementById("app");
const today=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function exList(i){return EX[WORDS[i][0]]||[WORDS[i][3]];}
function exIdx(i){const l=exList(i);return((P.ex&&P.ex[i])||0)%l.length;}
function nextEx(i){if(!P.ex)P.ex={};P.ex[i]=(exIdx(i)+1)%exList(i).length;save();render();}
function w(i){const wd=WORDS[i][0],l=exList(i),k=exIdx(i);
  return{word:wd,ipa:IPA[wd]||"",pos:WORDS[i][1],def:WORDS[i][2],ex:l[k],ant:WORDS[i][4],exN:k+1,exT:l.length};}
function exHtml(s){return s.replace(/\{(.+?)\}/g,"<b>$1</b>");}
function clozeHtml(s){return s.replace(/\{(.+?)\}/g,"<u> </u>");}
function clozeAnswer(s){const m=s.match(/\{(.+?)\}/);return m?m[1]:"";}

const Store={cloud:false,local:false,
  async read(){
    let a=null,b=null;
    try{const r=await window.storage.get(KEY);this.cloud=true;if(r&&r.value)a=r.value;}catch(e){}
    try{b=localStorage.getItem(KEY);localStorage.setItem(KEY+"-probe","1");localStorage.removeItem(KEY+"-probe");this.local=true;}catch(e){}
    const size=v=>{try{const o=JSON.parse(v);return Object.keys(o.words||{}).length;}catch(e){return -1;}};
    if(a&&b)return size(a)>=size(b)?a:b;   // whichever copy holds more progress wins
    return a||b;
  },
  async write(v){
    let ok=false;
    try{await window.storage.set(KEY,v);this.cloud=true;ok=true;}catch(e){this.cloud=false;}
    try{localStorage.setItem(KEY,v);this.local=true;ok=true;}catch(e){this.local=false;}
    return ok;
  },
  label(){return this.cloud&&this.local?"app + browser":this.cloud?"app":this.local?"browser":"NOT SAVING";}
};
async function load(){
  const v=await Store.read();
  if(v){try{P=JSON.parse(v);}catch(e){}}
  if(!P.words)P.words={};if(!P.log)P.log={};if(!P.ex)P.ex={};
  if(!P.rw)P.rw={};if(!P.read)P.read={};
  Object.keys(P.words).forEach(i=>{const s=P.words[i];
    if(!s.new)s.new=(s.seen===0&&s.lastSeen)?Date.parse(s.lastSeen+"T12:00"):0;});
}
async function save(){return Store.write(JSON.stringify(P));}

// Four steps, in the order a word actually moves through them:
//   new     - never opened
//   started - its first learn card is done   (red)
//   read    - you met it inside a passage and gave the right meaning (amber)
//   known   - box 4, the review interval is now months (green)
// Reading only recolours a word; it never changes when the word is due.
const STEPNAME={started:"started",read:"read in a text",known:"known"};
function state(i){const s=P.words[i];if(!s)return"new";
  if(s.box>=4)return"known";
  return (P.rw&&P.rw[i])?"read":"started";}
function count(st){return Object.keys(P.words).filter(i=>state(i)===st).length;}
function due(){const t=today();return Object.keys(P.words).filter(i=>{
  const s=P.words[i];return daysBetween(s.next,t)>=0;}).map(Number);}
function newOnes(n){return WORDS.map((_,i)=>i).filter(i=>!P.words[i]).slice(0,n);}

// at most 5 new words per rolling 24 hours: more than that just builds
// a review pile you cannot clear tomorrow
const DAY=864e5,NEWCAP=5;
function startedAt(i){const s=P.words[i];return s&&s.new?s.new:0;}
function recent(){const t=Date.now();
  return Object.keys(P.words).map(startedAt).filter(x=>x&&t-x<DAY).sort((a,b)=>a-b);}
function newQuota(){return Math.max(0,NEWCAP-recent().length);}
function unlockIn(){const r=recent();
  if(r.length<NEWCAP)return 0;
  return Math.max(0,r[r.length-NEWCAP]+DAY-Date.now());}
function hhmm(ms){const m=Math.ceil(ms/6e4),h=Math.floor(m/60);
  return h?h+"h "+(m%60)+"m":m+"m";}

function introduce(i){
  const s=P.words[i]||{box:0,right:0,wrong:0,seen:0};
  if(!s.new)s.new=Date.now();
  const d=new Date();d.setDate(d.getDate()+STEPS[0]);
  s.next=d.toISOString().slice(0,10);s.lastSeen=today();
  P.words[i]=s;save();
}

function grade(i,g){ // 0 again, 1 hard, 2 good, 3 easy
  const s=P.words[i]||{box:0,right:0,wrong:0,seen:0};
  s.seen++;
  if(g===0){s.wrong++;s.box=0;}
  else{s.right++;s.box=Math.min(STEPS.length-1,s.box+(g===1?0:g===2?1:2));}
  const d=new Date();d.setDate(d.getDate()+STEPS[s.box]);
  s.next=d.toISOString().slice(0,10);s.lastSeen=today();
  P.words[i]=s;
  const t=today();P.log[t]=P.log[t]||{right:0,wrong:0};
  if(g===0)P.log[t].wrong++;else P.log[t].right++;
  save();
}

// ---------- views ----------
function home(){
  const d=due(),q=newQuota(),nw=newOnes(q),wait=unlockIn();
  const known=count("known"),readw=count("read"),started=count("started");
  const total=WORDS.length,ARC=282.74;            // length of a 90px semicircle
  // stacked from the far end, each arc drawn over the one before it
  const gKnown=ARC*known/total, gRead=ARC*(known+readw)/total,
        gStarted=ARC*(known+readw+started)/total;
  const pct=Math.round(100*known/total);
  const can=d.length||nw.length;
  app.innerHTML=`
  <div class="gauge">
    <svg viewBox="0 0 220 124" width="100%" height="auto" aria-label="${pct}% known">
      <path class="seg" d="M20 112 A90 90 0 0 1 200 112" stroke="var(--track)"/>
      <path class="seg" d="M20 112 A90 90 0 0 1 200 112" stroke="var(--red)" stroke-dasharray="${gStarted} ${ARC}"/>
      <path class="seg" d="M20 112 A90 90 0 0 1 200 112" stroke="var(--amber)" stroke-dasharray="${gRead} ${ARC}"/>
      <path class="seg" d="M20 112 A90 90 0 0 1 200 112" stroke="var(--green)" stroke-dasharray="${gKnown} ${ARC}"/>
      <text class="gnum" x="110" y="96" text-anchor="middle">${pct}<tspan class="gpct">%</tspan></text>
    </svg>
  </div>
  <div class="key">
    <span><i class="dot known"></i>known <b>${known}</b></span>
    <span><i class="dot read"></i>read in a text <b>${readw}</b></span>
    <span><i class="dot started"></i>started <b>${started}</b></span>
  </div>
  <button class="go" id="go" ${can?"":"disabled"}>${can?"Study":(wait?"New words in "+hhmm(wait):"Done for today")}</button>
  <button class="go ghost" id="pr" ${pOpen().length?"":"disabled"}>Reading practice</button>
  <button class="go ghost" id="ls">Word list</button>
  <button class="linkbtn" id="bk">Back up progress</button>`;
  document.getElementById("go").onclick=()=>{
    if(d.length){queue=shuffle(d);qi=0;shown=false;session={right:0,wrong:0,mode:"review"};view="review";}
    else{queue=nw;qi=0;shown=false;session={right:0,wrong:0,mode:"learn"};view="learn";}
    render();};
  document.getElementById("pr").onclick=()=>{pPick();view="reading";render();};
  document.getElementById("ls").onclick=()=>{view="list";render();};
  document.getElementById("bk").onclick=()=>{view="backup";render();};
}

// READING: a random passage you can already read, then meaning questions
// built from the passage itself. Nothing here is scheduled - it is the place
// where the words you have learned turn up in somebody else's sentences.
function pOpen(){return PASSAGES.map((_,i)=>i).filter(i=>PASSAGES[i].w.every(j=>P.words[j]));}

function pPick(){
  const open=pOpen();
  if(!open.length){rp=-1;return;}
  if(!P.read)P.read={};
  let pool=open.filter(i=>!P.read[i]);          // unread first
  if(!pool.length)pool=open;
  if(pool.length>1)pool=pool.filter(i=>i!==rp); // never the same one twice
  rp=pool[Math.floor(Math.random()*pool.length)];
  rqs=makeQs(rp);rq=0;rright=0;ropts=null;
}

// one question per target word: what did the passage just tell you it means?
// wrong answers are real definitions of other words, same part of speech
// where there are enough of them, so guessing by grammar does not work
function makeQs(id){
  const p=PASSAGES[id];
  return p.w.map((i,k)=>{
    const pos=WORDS[i][1];
    const rest=WORDS.map((_,j)=>j).filter(j=>j!==i&&p.w.indexOf(j)<0);
    let wrong=shuffle(rest.filter(j=>WORDS[j][1]===pos)).slice(0,3);
    if(wrong.length<3)wrong=wrong.concat(shuffle(rest).slice(0,3-wrong.length));
    return {i:i,q:'In this passage, what does <b>'+p.m[k]+'</b> mean?',
            o:[WORDS[i][2]].concat(wrong.map(j=>WORDS[j][2]))};
  });
}

function reading(){
  if(rp<0)return home();
  const p=PASSAGES[rp],open=pOpen().length,wait=unlockIn();
  app.innerHTML=`<h1>Reading practice</h1>
  <p class="muted">${open} passage${open===1?"":"s"} open${wait?" \u00b7 more in "+hhmm(wait):""}</p>
  <div class="card"><div class="story">${storyHtml(p.s)}</div>
    ${p.src?`<div class="exnav" style="margin-top:12px">${p.src}</div>`:""}</div>
  <button class="go" id="q">Answer the questions</button>
  <button class="go ghost" id="an">Another passage</button>
  <button class="linkbtn" id="ch">Story chapters</button>
  <button class="go ghost" id="h">Back</button>`;
  document.getElementById("q").onclick=()=>{rq=0;rright=0;ropts=null;view="rquiz";render();};
  document.getElementById("an").onclick=()=>{pPick();render();};
  document.getElementById("ch").onclick=()=>{view="practice";render();};
  document.getElementById("h").onclick=()=>{view="home";render();};
}

function rquiz(){
  const p=PASSAGES[rp];
  if(rq>=rqs.length){
    if(!P.read)P.read={};
    P.read[rp]=1;save();
    app.innerHTML=`<h1>${rright} of ${rqs.length}</h1>
    <div class="card muted"><p>${rright===rqs.length
      ?"You read the meaning out of the sentences around it. That is how words are actually learned."
      :"Read it once more and look at what happens either side of the word - the passage explains more than a definition can."}</p></div>
    <button class="go" id="an">Another passage</button>
    <button class="go ghost" id="r">Read it again</button>
    <button class="go ghost" id="h">Back</button>`;
    document.getElementById("an").onclick=()=>{pPick();view="reading";render();};
    document.getElementById("r").onclick=()=>{view="reading";render();};
    document.getElementById("h").onclick=()=>{view="home";render();};
    return;
  }
  const q=rqs[rq];
  if(!ropts)ropts=shuffle(q.o.map((t,k)=>({t:t,ok:k===0})));
  app.innerHTML=`<div class="bar"><span style="width:${Math.round(100*rq/rqs.length)}%"></span></div>
  <div class="top"><span class="pill">Question ${rq+1} of ${rqs.length}</span></div>
  <div class="card"><p class="def">${q.q}</p>
  ${ropts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=ropts[+b.dataset.k];
    b.className="opt "+(o.ok?"right":"wrong");
    // getting it right from the passage alone is what turns the word amber
    if(o.ok){rright++;if(!P.rw)P.rw={};P.rw[q.i]=1;save();}
    setTimeout(()=>{rq++;ropts=null;render();},600);
  });
}

// PRACTICE: pick a passage, read it, then answer from what the text told you
function practice(){
  const r=readySets();
  app.innerHTML=`<h1>Reading practice</h1>
  <p class="muted">One story, twenty chapters. A new chapter opens with every five words you learn. Read it once, work the meanings out from the story, then answer.</p>
  ${r.map(n=>`<button class="go ghost pick" data-n="${n}">${n+1}. ${STORIES[n].t}
    <small>words ${n*5+1}\u2013${n*5+5}</small></button>`).join("")}
  <button class="go ghost" id="h">Back</button>`;
  app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
    sn=+b.dataset.n;sq=0;sright=0;sopts=null;view="story";render();});
  document.getElementById("h").onclick=()=>{view=rp<0?"home":"reading";render();};
}

function story(){
  const st=STORIES[sn];
  app.innerHTML=`<h1>${sn+1}. ${st.t}</h1>
  <p class="muted">Chapter ${sn+1} of ${STORIES.length}</p>
  <div class="card"><div class="story">${storyHtml(st.s)}</div></div>
  <button class="go" id="q">Answer the questions</button>
  <button class="go ghost" id="h">Back</button>`;
  document.getElementById("q").onclick=()=>{view="squiz";render();};
  document.getElementById("h").onclick=()=>{view="practice";render();};
}

function squiz(){
  const st=STORIES[sn];
  if(sq>=st.q.length){
    app.innerHTML=`<h1>${sright} of ${st.q.length}</h1>
    <div class="card muted"><p>${sright===st.q.length
      ?"The text gave you every answer \u2014 that is exactly how you meet new words outside a card."
      :"Read the passage again and look for the sentence around each word. The story explains more than the definition does."}</p></div>
    ${readySets().indexOf(sn)<readySets().length-1?`<button class="go" id="nc">Next chapter</button>`:""}
    <button class="go ghost" id="r">Read it again</button>
    <button class="go ghost" id="h">Back</button>`;
    const nc=document.getElementById("nc");
    if(nc)nc.onclick=()=>{const r=readySets();sn=r[r.indexOf(sn)+1];
      sq=0;sright=0;sopts=null;view="story";render();};
    document.getElementById("r").onclick=()=>{sq=0;sright=0;sopts=null;view="story";render();};
    document.getElementById("h").onclick=()=>{view="practice";render();};
    return;
  }
  const q=st.q[sq];
  if(!sopts)sopts=shuffle(q.o.map((t,k)=>({t:t,ok:k===0})));
  app.innerHTML=`<div class="bar"><span style="width:${Math.round(100*sq/st.q.length)}%"></span></div>
  <div class="top"><span class="pill">Question ${sq+1} of ${st.q.length}</span></div>
  <div class="card"><p class="def">${q.q}</p>
  ${sopts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=sopts[+b.dataset.k];
    b.className="opt "+(o.ok?"right":"wrong");
    if(o.ok)sright++;
    setTimeout(()=>{sq++;sopts=null;render();},600);
  });
}

// LIST: every word already started, with the example you chose for it
function list(){
  const seen=WORDS.map((_,i)=>i).filter(i=>P.words[i]);
  const RANK={started:0,read:1,known:2};
  seen.sort((a,b)=>RANK[state(a)]-RANK[state(b)]||a-b);
  const body=seen.length?seen.map(i=>{const c=w(i);
    return `<div class="card item">
      <div class="ihead"><span class="dot ${state(i)}"></span><b>${c.word}</b>
        <span class="ipos">/${c.ipa}/ · ${c.pos}</span>
        <button class="say tiny" data-say="${c.word}">\U0001f50a</button></div>
      <div class="idef">${c.def}</div>
      <div class="ex">${exHtml(c.ex)}</div>
      ${c.ant!=="\u2014"?`<div class="anto">opposite: ${c.ant}</div>`:""}
    </div>`;}).join("")
    :`<div class="card muted">Nothing here yet. Press Study to start your first ten words.</div>`;
  app.innerHTML=`<h1>Word list</h1>${body}<button class="go ghost" id="h">Back</button>`;
  document.getElementById("h").onclick=()=>{view="home";render();};
}

function setReady(n){for(let i=n*5;i<n*5+5;i++)if(!P.words[i])return false;return true;}
function readySets(){return STORIES.map((_,n)=>n).filter(setReady);}
function storyHtml(t){return t.replace(/\{(.+?)\}/g,"<b>$1</b>");}

function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}

function bar(){return `<div class="bar"><span style="width:${Math.round(100*qi/queue.length)}%"></span></div>`;}

// LEARN: show the word, then move on. No test here — a test one second
// after reading the answer proves nothing. The real check is tomorrow's review.
function learn(){
  if(qi>=queue.length)return done();
  const i=queue[qi],c=w(i);
  app.innerHTML=bar()+`<div class="top"><span class="pill">New word ${qi+1} of ${queue.length}</span></div>
  <div class="card">
    <div class="word">${c.word}</div><div class="pos">/${c.ipa}/ · ${c.pos}</div>
    <button class="say" data-say="${c.word}">🔊 listen</button>
    <div class="def">${c.def}</div>
    <div class="ex">${exHtml(c.ex)}</div>
    ${c.ant!=="—"?`<div class="anto">opposite: ${c.ant}</div>`:""}
    <div class="exnav">example ${c.exN} of ${c.exT}</div>
  </div>
  <button class="go" id="n">Got it</button>
  <button class="go ghost" id="alt">Show another example</button>`;
  document.getElementById("n").onclick=()=>{introduce(i);session.right++;qi++;render();};
  document.getElementById("alt").onclick=()=>nextEx(i);
}

// REVIEW: recall first (cloze), self-grade — the strongest form of practice
function review(){
  if(qi>=queue.length)return done();
  const i=queue[qi],c=w(i);
  const useCloze=(P.words[i].seen%2===0);
  if(!shown){
    app.innerHTML=bar()+`<div class="top"><span class="pill">Review ${qi+1} of ${queue.length}</span>
      <span class="pill">${STEPNAME[state(i)]}</span></div>
    <div class="card">
      ${useCloze?`<p class="muted">Which word is missing?</p><div class="cloze">${clozeHtml(c.ex)}</div>`
                :`<p class="muted">What does this word mean?</p><div class="word">${c.word}</div><div class="pos">/${c.ipa}/ · ${c.pos}</div>`}
      <p class="muted">Recall it yourself, out loud, and only then reveal it.</p>
    </div>
    <button class="go" id="s">Show answer</button>`;
    document.getElementById("s").onclick=()=>{shown=true;render();};
  }else{
    app.innerHTML=`<div class="card">
      <div class="word">${c.word}</div><div class="pos">/${c.ipa}/ · ${c.pos}</div>
      <button class="say" data-say="${c.word}">🔊 listen</button>
      <div class="def">${c.def}</div>
      <div class="ex">${exHtml(c.ex)}</div>
      ${c.ant!=="—"?`<div class="anto">opposite: ${c.ant}</div>`:""}
      <div class="exnav">example ${c.exN} of ${c.exT}</div>
      <button class="say alt" id="alt" style="margin:10px 0 0">Show another example</button>
    </div>
    <p class="muted">How easily did it come back?</p>
    <div class="grade">
      <button class="g0" data-g="0">Forgot<small>again today</small></button>
      <button data-g="1">Hard<small>same interval</small></button>
      <button data-g="2">Good<small>next interval</small></button>
      <button class="g3" data-g="3">Easy<small>skip an interval</small></button>
    </div>`;
    document.getElementById("alt").onclick=()=>nextEx(i);
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const g=+b.dataset.g;
      if(g===0){session.wrong++;queue.push(i);}else session.right++;
      grade(i,g);qi++;shown=false;render();
    });
  }
}

function done(){
  const t=today();
  if(P.last!==t){P.streak=(P.last&&daysBetween(P.last,t)===1)?(P.streak||0)+1:1;P.last=t;save();}
  const tot=session.right+session.wrong;
  app.innerHTML=`<h1>Done</h1>
  <div class="card">
    ${session.mode==="learn"
      ?`<div class="row"><span>New words seen</span><b>${session.right}</b></div>`
      :`<div class="row"><span>Correct</span><b>${session.right}</b></div>
    <div class="row"><span>Missed</span><b>${session.wrong}</b></div>
    <div class="row"><span>Accuracy</span><b>${tot?Math.round(100*session.right/tot):0}%</b></div>`}
    <div class="row"><span>Day streak</span><b>${P.streak||1}</b></div>
  </div>
  ${session.mode==="learn"?`<div class="card muted"><p>These words come back tomorrow. Today, try to meet one of them in a book, or say your own sentence with it out loud — a word sticks from use, not from the card.</p></div>`:""}
  ${session.mode==="review"&&newOnes(newQuota()).length?`<button class="go" id="nx">Learn ${newOnes(newQuota()).length} new</button>`:""}
  <button class="go ghost" id="h">Home</button>`;
  const nx=document.getElementById("nx");
  if(nx)nx.onclick=()=>{queue=newOnes(newQuota());qi=0;shown=false;session={right:0,wrong:0,mode:"learn"};view="learn";render();};
  document.getElementById("h").onclick=()=>{view="home";render();};
}

function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;
   speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function wireSay(){app.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say);});}

function backup(){
  const data=JSON.stringify(P);
  app.innerHTML=`<h1>Back up progress</h1>
  <div class="card">
    <p class="muted">Copy this text and keep it anywhere — in your notes, or email it to yourself. Your progress restores from it completely.</p>
    <textarea id="out" readonly style="width:100%;height:110px;font-size:12px;font-family:monospace;border:1px solid var(--line);border-radius:4px;padding:8px">${data}</textarea>
    <button class="go" id="cp" style="margin-top:10px">Copy</button>
  </div>
  <div class="card">
    <p><b>Restore</b></p>
    <p class="muted">Paste your saved text and press Restore. This replaces your current progress.</p>
    <textarea id="in" style="width:100%;height:90px;font-size:12px;font-family:monospace;border:1px solid var(--line);border-radius:4px;padding:8px"></textarea>
    <button class="go ghost" id="rs" style="margin-top:10px">Restore</button>
    <div id="msg" class="muted" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <p><b>Start over</b></p>
    <p class="muted">Erases every word, every interval and the streak. Copy the backup text above first if you might want it back.</p>
    <button class="go ghost" id="rz">Reset progress</button>
  </div>
  <button class="go ghost" id="h">Back</button>`;
  let armed=false;
  document.getElementById("rz").onclick=async()=>{
    const b=document.getElementById("rz");
    if(!armed){armed=true;b.textContent="Tap again to erase everything";
      b.style.borderColor="var(--red)";b.style.color="var(--red)";return;}
    P={words:{},log:{},ex:{},streak:0,last:null};
    await Store.write(JSON.stringify(P));
    view="home";render();
  };
  document.getElementById("cp").onclick=async()=>{
    const t=document.getElementById("out");t.select();
    try{await navigator.clipboard.writeText(data);}catch(e){try{document.execCommand("copy");}catch(e2){}}
    document.getElementById("cp").textContent="Copied";
  };
  document.getElementById("rs").onclick=async()=>{
    const raw=document.getElementById("in").value.trim();
    const m=document.getElementById("msg");
    try{
      const o=JSON.parse(raw);
      if(!o.words) throw new Error("bad");
      P=o; if(!P.log)P.log={}; if(!P.ex)P.ex={};
      await Store.write(JSON.stringify(P));
      m.textContent="Restored: "+Object.keys(P.words).length+" words.";
    }catch(e){m.textContent="Could not read that text. Check that you pasted all of it.";}
  };
  document.getElementById("h").onclick=()=>{view="home";render();};
}
function render(){
  if(view==="home")home();
  else if(view==="learn")learn();
  else if(view==="review")review();
  else if(view==="practice")practice();
  else if(view==="reading")reading();
  else if(view==="rquiz")rquiz();
  else if(view==="story")story();
  else if(view==="squiz")squiz();
  else if(view==="list")list();
  else if(view==="backup")backup();
  wireSay();
}
load().then(render);
</script>
</body></html>
