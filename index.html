<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Словник — тренажер</title>
<style>
  :root{--paper:#EFEDE7;--card:#fff;--ink:#1A2028;--soft:#5C6670;--line:#CFD3CB;
    --green:#1D6560;--green-d:#134A46;--amber:#B4600F;--red:#93342A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:18px 16px 60px}
  .wrap{max-width:34rem;margin:0 auto}
  h1{font-family:Georgia,serif;font-weight:400;font-size:1.8rem;margin:6px 0 14px}
  h2{font-size:1.05rem;margin:0 0 10px}
  p{margin:0 0 12px}
  .muted{color:var(--soft);font-size:.93rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:18px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border-radius:4px}
  .go{display:block;width:100%;background:var(--green);color:#fff;border:none;padding:14px;font-weight:600;margin-bottom:10px}
  .go:hover{background:var(--green-d)}
  .go.ghost{background:#fff;color:var(--green-d);border:1px solid var(--green)}
  .go[disabled]{opacity:.4;cursor:default}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    padding:12px 14px;margin-bottom:8px;color:var(--ink)}
  .opt:hover{border-color:var(--green)}
  .opt.right{border-color:var(--green);background:#EEF5F3}
  .opt.wrong{border-color:var(--red);background:#FBEFEE}
  .word{font-family:Georgia,serif;font-size:2.3rem;line-height:1.1;margin:6px 0 4px}
  .pos{color:var(--soft);font-size:.95rem;margin-bottom:12px;font-family:Georgia,serif}
  .say{background:#fff;border:1px solid var(--line);color:var(--green-d);padding:8px 14px;font-size:.9rem;margin-bottom:14px}
  .def{font-size:1.08rem;margin-bottom:12px}
  .ex{font-family:Georgia,serif;background:#F6F5F1;border-left:3px solid var(--line);padding:10px 12px;margin-bottom:10px}
  .ex b{background:#E4EDE9;padding:0 3px;border-radius:2px;font-weight:600}
  .cloze{font-family:Georgia,serif;font-size:1.2rem;margin:14px 0 18px}
  .cloze u{text-decoration:none;border-bottom:2px solid var(--green);padding:0 26px}
  .anto{font-size:.95rem;color:var(--soft)}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grade button{padding:13px 8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
  .grade button small{display:block;font-weight:400;color:var(--soft);font-size:.78rem}
  .g0{border-color:var(--red)!important;color:var(--red)!important}
  .g3{border-color:var(--green)!important;color:var(--green-d)!important}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .pill{font-size:.82rem;color:var(--soft)}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
  .bar span{display:block;height:100%;background:var(--green);width:0}
  .fb{padding:10px 12px;border-radius:4px;margin-bottom:12px;font-size:.95rem}
  .fb.ok{background:#EEF5F3;border-left:3px solid var(--green)}
  .fb.no{background:#FBEFEE;border-left:3px solid var(--red)}
  a{color:var(--green-d)}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
// ============ words: Oxford-3000 band, 10 per day ============
// [word, part of speech, English definition, example with {target}, antonym]
const WORDS=[
// day 1
["shallow","adj","not deep; the bottom is close to the surface","The children played in the {shallow} end of the pool.","deep"],
["stubborn","adj","refusing to change your mind, even when others are right","He is too {stubborn} to ask for help.","flexible"],
["tremble","verb","to shake slightly, from cold, fear or weakness","Her hands {trembled} as she opened the letter.","steady"],
["spill","verb","to let liquid fall out of a container by accident","I {spilled} coffee on my shirt.","contain"],
["greedy","adj","wanting more money or food than you need","The {greedy} man took three plates.","generous"],
["ancient","adj","from a very long time ago","They found {ancient} coins under the field.","modern"],
["bare","adj","not covered by anything","He walked on the cold floor with {bare} feet.","covered"],
["cheerful","adj","happy and showing it","She gave a {cheerful} wave from the window.","gloomy"],
["scatter","verb","to throw or drop things in many directions","The wind {scattered} the papers across the yard.","gather"],
["fierce","adj","violent, angry or very strong","A {fierce} dog guarded the gate.","gentle"],
// day 2
["hollow","adj","empty inside","The tree was {hollow} and full of birds.","solid"],
["damp","adj","slightly wet, usually in an unpleasant way","The basement smelled {damp}.","dry"],
["clumsy","adj","moving badly and dropping or breaking things","He is {clumsy} with small tools.","graceful"],
["rusty","adj","covered in rust, the brown layer on old metal","The gate was {rusty} and hard to open.","polished"],
["grief","noun","deep sadness after someone dies or you lose something","She could not speak from {grief}.","joy"],
["stroll","verb","to walk slowly for pleasure","We {strolled} along the river after dinner.","rush"],
["vow","verb","to promise something seriously","He {vowed} never to smoke again.","break a promise"],
["weary","adj","very tired, especially after a long effort","The {weary} crew sat down on the pipes.","refreshed"],
["blunt","adj","not sharp; also, saying things directly","This knife is {blunt}.","sharp"],
["mock","verb","to laugh at someone in an unkind way","They {mocked} his accent.","praise"],
// day 3
["shelf","noun","a flat board on a wall for keeping things on","Put the drill back on the {shelf}.","—"],
["guilty","adj","feeling bad because you did something wrong","He felt {guilty} about leaving early.","innocent"],
["crowd","noun","a large group of people in one place","A {crowd} gathered outside the station.","—"],
["whistle","verb","to make a high sound by blowing air through your lips","He {whistled} while he worked.","—"],
["shadow","noun","the dark shape made when something blocks light","The building threw a long {shadow}.","light"],
["borrow","verb","to take something and give it back later","Can I {borrow} your wrench?","lend"],
["curl","verb","to bend into a round shape","The paper {curled} in the heat.","straighten"],
["spare","adj","extra, kept in case you need it","Keep a {spare} blade in the van.","main"],
["tidy","adj","neat, with everything in its place","His workspace is always {tidy}.","messy"],
["swallow","verb","to make food or drink go down your throat","He {swallowed} the pill with water.","spit out"],
// day 4
["wrap","verb","to cover something by folding material around it","{Wrap} the pipe before you paint.","unwrap"],
["squeeze","verb","to press something firmly from both sides","She {squeezed} the tube to get the last of it.","release"],
["lean","verb","to bend or rest against something","He {leaned} the ladder against the wall.","stand upright"],
["shrink","verb","to become smaller","The shirt {shrank} in the wash.","expand"],
["stretch","verb","to become longer or wider by pulling","{Stretch} the tape across the door.","shrink"],
["drag","verb","to pull something heavy along the ground","They {dragged} the box across the floor.","push"],
["crack","noun","a thin line where something is broken","There is a {crack} in the wall.","—"],
["rub","verb","to move your hand back and forth on a surface","He {rubbed} his eyes and kept working.","—"],
["steady","adj","not shaking; regular and continuous","Keep the light {steady} while I cut.","shaky"],
["rough","adj","not smooth; also, not exact","The surface felt {rough} under his hand.","smooth"],
// day 5
["tight","adj","fixed firmly; difficult to move","The bolt is too {tight} to turn by hand.","loose"],
["loose","adj","not firmly fixed","One screw was {loose}.","tight"],
["strict","adj","demanding that rules are obeyed","The site has {strict} safety rules.","relaxed"],
["rude","adj","not polite; offending people","It was {rude} to leave without answering.","polite"],
["eager","adj","wanting to do something very much","He was {eager} to start the new job.","reluctant"],
["anxious","adj","worried about something that may happen","She felt {anxious} before the interview.","calm"],
["reward","noun","something good you get for good work","A day off was his {reward}.","punishment"],
["threat","noun","a warning that something bad may happen","Rain was a {threat} to the schedule.","—"],
["shame","noun","the bad feeling when you have done wrong","He lowered his eyes in {shame}.","pride"],
["burden","noun","a heavy load, or a difficult responsibility","The debt was a {burden} on the family.","relief"],
// day 6
["edge","noun","the outside line or border of something","Don't stand near the {edge} of the roof.","centre"],
["pile","noun","a number of things put on top of each other","There was a {pile} of pipes by the door.","—"],
["gap","noun","an empty space between two things","Leave a small {gap} between the boards.","—"],
["warn","verb","to tell someone about a possible danger","I {warned} him about the wet floor.","—"],
["admit","verb","to agree that something is true, often unwillingly","He {admitted} that he was wrong.","deny"],
["deny","verb","to say that something is not true","She {denied} taking the tools.","admit"],
["avoid","verb","to keep away from something","{Avoid} the bridge at five o'clock.","face"],
["delay","verb","to make something happen later than planned","Rain {delayed} the delivery.","hurry"],
["attach","verb","to fix one thing to another","{Attach} the bracket to the wall first.","detach"],
["replace","verb","to put something new in place of something old","We {replaced} the broken valve.","keep"],
// day 7
["improve","verb","to become better or make better","His English {improved} in six months.","worsen"],
["reduce","verb","to make smaller in size or amount","{Reduce} the pressure slowly.","increase"],
["rely","verb","to need or trust someone to do something","I {rely} on him to lock up.","—"],
["afford","verb","to have enough money for something","I can't {afford} a new van this year.","—"],
["deserve","verb","to have earned something by what you did","After that shift you {deserve} a rest.","—"],
["pretend","verb","to behave as if something is true when it is not","He {pretended} not to hear.","—"],
["suppose","verb","to think that something is probably true","I {suppose} he's still at work.","know"],
["hesitate","verb","to pause before doing something because you are unsure","She {hesitated} before answering.","act"],
["struggle","verb","to try hard to do something difficult","He {struggled} with the heavy pipe.","manage easily"],
["attempt","noun","an act of trying to do something","His first {attempt} failed.","—"],
// day 8
["rarely","adv","not often","He {rarely} takes a day off.","often"],
["barely","adv","almost not; only just","We {barely} finished before dark.","easily"],
["eventually","adv","in the end, after a long time","{Eventually} the pump started working.","immediately"],
["gradually","adv","slowly, over a period of time","The pain {gradually} went away.","suddenly"],
["slightly","adv","a little bit","The pipe is {slightly} bent.","greatly"],
["roughly","adv","approximately, not exactly","It costs {roughly} two hundred dollars.","exactly"],
["mainly","adv","mostly; more than anything else","The job is {mainly} indoor work.","partly"],
["besides","adv","in addition; also","It's late, and {besides}, I'm tired.","—"],
["indeed","adv","used to confirm or emphasise something","It was, {indeed}, the wrong part.","—"],
["therefore","adv","for that reason","The line was blocked; {therefore} we stopped.","—"],
// day 9
["shelter","noun","a place that protects you from weather or danger","They took {shelter} under the roof.","—"],
["leak","noun","a hole where liquid or gas escapes","There is a {leak} in the joint.","seal"],
["spark","noun","a small flash of fire or electricity","A {spark} jumped from the wire.","—"],
["crew","noun","a group of people who work together","Our {crew} starts at six thirty.","—"],
["shift","noun","a period of work in a day","He works the night {shift}.","—"],
["wage","noun","money paid for work, usually by the hour","The {wage} covers rent and food.","—"],
["ladder","noun","equipment with steps for climbing","Hold the {ladder} steady.","—"],
["bolt","noun","a metal pin that fastens things together","Tighten the last {bolt}.","—"],
["drill","verb","to make a hole with a tool","{Drill} two holes in the bracket.","fill"],
["tape","noun","a long thin strip used to stick or measure","Bring the measuring {tape}.","—"],
// day 10
["consider","verb","to think about something carefully","We {considered} three options.","ignore"],
["realise","verb","to understand something for the first time","He {realised} he had the wrong key.","—"],
["notice","verb","to see or become aware of something","Did you {notice} the crack?","overlook"],
["recognise","verb","to know someone or something because you have seen it before","I didn't {recognise} his voice.","—"],
["expect","verb","to think that something will happen","We {expect} rain tomorrow.","—"],
["prefer","verb","to like one thing more than another","I {prefer} mornings.","—"],
["complain","verb","to say that you are not satisfied","The tenant {complained} about the noise.","praise"],
["apologise","verb","to say you are sorry","He {apologised} for being late.","—"],
["encourage","verb","to give someone confidence to do something","She {encouraged} him to keep reading.","discourage"],
["achieve","verb","to succeed in doing something after effort","He {achieved} what he set out to do.","fail"]
];


// American English pronunciation. The mark ˈ stands right before the stressed syllable.
const IPA={
shallow:"ˈʃæloʊ",stubborn:"ˈstʌbərn",tremble:"ˈtrembəl",spill:"spɪl",greedy:"ˈɡriːdi",
ancient:"ˈeɪnʃənt",bare:"ber",cheerful:"ˈtʃɪrfəl",scatter:"ˈskætər",fierce:"fɪrs",
hollow:"ˈhɑːloʊ",damp:"dæmp",clumsy:"ˈklʌmzi",rusty:"ˈrʌsti",grief:"ɡriːf",
stroll:"stroʊl",vow:"vaʊ",weary:"ˈwɪri",blunt:"blʌnt",mock:"mɑːk",
shelf:"ʃelf",guilty:"ˈɡɪlti",crowd:"kraʊd",whistle:"ˈwɪsəl",shadow:"ˈʃædoʊ",
borrow:"ˈbɑːroʊ",curl:"kɜːrl",spare:"sper",tidy:"ˈtaɪdi",swallow:"ˈswɑːloʊ",
wrap:"ræp",squeeze:"skwiːz",lean:"liːn",shrink:"ʃrɪŋk",stretch:"stretʃ",
drag:"dræɡ",crack:"kræk",rub:"rʌb",steady:"ˈstedi",rough:"rʌf",
tight:"taɪt",loose:"luːs",strict:"strɪkt",rude:"ruːd",eager:"ˈiːɡər",
anxious:"ˈæŋkʃəs",reward:"rɪˈwɔːrd",threat:"θret",shame:"ʃeɪm",burden:"ˈbɜːrdən",
edge:"edʒ",pile:"paɪl",gap:"ɡæp",warn:"wɔːrn",admit:"ədˈmɪt",
deny:"dɪˈnaɪ",avoid:"əˈvɔɪd",delay:"dɪˈleɪ",attach:"əˈtætʃ",replace:"rɪˈpleɪs",
improve:"ɪmˈpruːv",reduce:"rɪˈduːs",rely:"rɪˈlaɪ",afford:"əˈfɔːrd",deserve:"dɪˈzɜːrv",
pretend:"prɪˈtend",suppose:"səˈpoʊz",hesitate:"ˈhezɪteɪt",struggle:"ˈstrʌɡəl",attempt:"əˈtempt",
rarely:"ˈrerli",barely:"ˈberli",eventually:"ɪˈventʃuəli",gradually:"ˈɡrædʒuəli",slightly:"ˈslaɪtli",
roughly:"ˈrʌfli",mainly:"ˈmeɪnli",besides:"bɪˈsaɪdz",indeed:"ɪnˈdiːd",therefore:"ˈðerfɔːr",
shelter:"ˈʃeltər",leak:"liːk",spark:"spɑːrk",crew:"kruː",shift:"ʃɪft",
wage:"weɪdʒ",ladder:"ˈlædər",bolt:"boʊlt",drill:"drɪl",tape:"teɪp",
consider:"kənˈsɪdər",realise:"ˈriːəlaɪz",notice:"ˈnoʊtɪs",recognise:"ˈrekəɡnaɪz",expect:"ɪkˈspekt",
prefer:"prɪˈfɜːr",complain:"kəmˈpleɪn",apologise:"əˈpɑːlədʒaɪz",encourage:"ɪnˈkɜːrɪdʒ",achieve:"əˈtʃiːv"
};

// intervals in days; spacing itself is what the research supports
const STEPS=[1,3,7,16,35,90];
const KEY="vocab-progress";
let P={words:{},log:{},streak:0,last:null};
let view="home",queue=[],qi=0,shown=false,session={right:0,wrong:0,mode:""};

const app=document.getElementById("app");
const today=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function w(i){const wd=WORDS[i][0];return{word:wd,ipa:IPA[wd]||"",pos:WORDS[i][1],def:WORDS[i][2],ex:WORDS[i][3],ant:WORDS[i][4]};}
function exHtml(s){return s.replace(/\{(.+?)\}/g,"<b>$1</b>");}
function clozeHtml(s){return s.replace(/\{(.+?)\}/g,"<u> </u>");}
function clozeAnswer(s){const m=s.match(/\{(.+?)\}/);return m?m[1]:"";}

const Store={cloud:false,local:false,
  async read(){
    let a=null,b=null;
    try{const r=await window.storage.get(KEY);this.cloud=true;if(r&&r.value)a=r.value;}catch(e){}
    try{b=localStorage.getItem(KEY);localStorage.setItem(KEY+"-probe","1");localStorage.removeItem(KEY+"-probe");this.local=true;}catch(e){}
    const size=v=>{try{const o=JSON.parse(v);return Object.keys(o.words||{}).length;}catch(e){return -1;}};
    if(a&&b)return size(a)>=size(b)?a:b;   // whichever copy holds more progress wins
    return a||b;
  },
  async write(v){
    let ok=false;
    try{await window.storage.set(KEY,v);this.cloud=true;ok=true;}catch(e){this.cloud=false;}
    try{localStorage.setItem(KEY,v);this.local=true;ok=true;}catch(e){this.local=false;}
    return ok;
  },
  label(){return this.cloud&&this.local?"подвійне":this.cloud?"застосунок":this.local?"браузер":"НЕ ПРАЦЮЄ";}
};
async function load(){
  const v=await Store.read();
  if(v){try{P=JSON.parse(v);}catch(e){}}
  if(!P.words)P.words={};if(!P.log)P.log={};
}
async function save(){return Store.write(JSON.stringify(P));}

function state(i){const s=P.words[i];if(!s)return"new";return s.box>=4?"known":"learning";}
function due(){const t=today();return Object.keys(P.words).filter(i=>{
  const s=P.words[i];return daysBetween(s.next,t)>=0;}).map(Number);}
function newOnes(n){return WORDS.map((_,i)=>i).filter(i=>!P.words[i]).slice(0,n);}

function grade(i,g){ // 0 again, 1 hard, 2 good, 3 easy
  const s=P.words[i]||{box:0,right:0,wrong:0,seen:0};
  s.seen++;
  if(g===0){s.wrong++;s.box=0;}
  else{s.right++;s.box=Math.min(STEPS.length-1,s.box+(g===1?0:g===2?1:2));}
  const d=new Date();d.setDate(d.getDate()+STEPS[s.box]);
  s.next=d.toISOString().slice(0,10);s.lastSeen=today();
  P.words[i]=s;
  const t=today();P.log[t]=P.log[t]||{right:0,wrong:0};
  if(g===0)P.log[t].wrong++;else P.log[t].right++;
  save();
}

// ---------- views ----------
function home(){
  const d=due(),nw=newOnes(10);
  const known=Object.keys(P.words).filter(i=>state(i)==="known").length;
  const learn=Object.keys(P.words).filter(i=>state(i)==="learning").length;
  const t=today(),lg=P.log[t]||{right:0,wrong:0};
  const total=Object.values(P.log).reduce((a,x)=>a+x.right+x.wrong,0);
  const okAll=Object.values(P.log).reduce((a,x)=>a+x.right,0);
  app.innerHTML=`<h1>Словник</h1>
  <div class="card">
    <div class="row"><span>Нових на сьогодні</span><b>${nw.length}</b></div>
    <div class="row"><span>На повторення</span><b>${d.length}</b></div>
    <div class="row"><span>Вивчається</span><b>${learn}</b></div>
    <div class="row"><span>Засвоєно</span><b>${known} з ${WORDS.length}</b></div>
  </div>
  <button class="go" id="rev" ${d.length?"":"disabled"}>Повторити ${d.length?"("+d.length+")":"— на сьогодні все"}</button>
  <button class="go ghost" id="new" ${nw.length?"":"disabled"}>Вчити нові 10</button>
  <div class="card">
    <h2>Сьогодні</h2>
    <div class="row"><span>Правильно / помилок</span><b>${lg.right} / ${lg.wrong}</b></div>
    <div class="row"><span>Точність за весь час</span><b>${total?Math.round(100*okAll/total):0}%</b></div>
  </div>
  <div class="card">
    <div class="row"><span>Збереження</span><b>${Store.label()}</b></div>
    <div class="row"><span>Слів у пам&#39;яті</span><b>${Object.keys(P.words).length}</b></div>
    <button class="go ghost" id="bk" style="margin-top:12px">Резервна копія</button>
  </div>
  <div class="card muted">
    <p><b>Порядок дня:</b> спочатку повторення, потім нові слова. Повторення важливіше — без нього нові слова просто зникнуть.</p>
    <p><b>Транскрипція:</b> знак ˈ стоїть перед наголошеним складом — /rɪˈwɔːrd/ означає наголос на другому. Кнопка 🔊 читає слово вголос американською вимовою.</p>
    <p>Слово вважається засвоєним після 5 успішних згадувань із дедалі більшими проміжками: 1 → 3 → 7 → 16 → 35 днів.</p>
  </div>`;
  document.getElementById("rev").onclick=()=>{queue=shuffle(due());qi=0;session={right:0,wrong:0,mode:"review"};view="review";render();};
  document.getElementById("new").onclick=()=>{queue=newOnes(10);qi=0;session={right:0,wrong:0,mode:"learn"};view="learn";render();};
  document.getElementById("bk").onclick=()=>{view="backup";render();};
}

function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}

function bar(){return `<div class="bar"><span style="width:${Math.round(100*qi/queue.length)}%"></span></div>`;}

// LEARN: see the word properly, then one immediate retrieval check
function learn(){
  if(qi>=queue.length)return done();
  const i=queue[qi],c=w(i);
  if(!shown){
    app.innerHTML=bar()+`<div class="top"><span class="pill">Нове слово ${qi+1} з ${queue.length}</span></div>
    <div class="card">
      <div class="word">${c.word}</div><div class="pos">/${c.ipa}/ · ${c.pos}</div>
      <button class="say" data-say="${c.word}">🔊 послухати</button>
      <div class="def">${c.def}</div>
      <div class="ex">${exHtml(c.ex)}</div>
      ${c.ant!=="—"?`<div class="anto">opposite: ${c.ant}</div>`:""}
    </div>
    <button class="go" id="n">Далі</button>`;
    document.getElementById("n").onclick=()=>{shown=true;render();};
  }else{
    // immediate check: definition -> pick the word
    const wrong=shuffle(WORDS.map((_,k)=>k).filter(k=>k!==i)).slice(0,3).map(k=>WORDS[k][0]);
    const opts=shuffle([c.word,...wrong]);
    app.innerHTML=bar()+`<div class="top"><span class="pill">Перевірка</span></div>
    <div class="card"><p class="muted">Яке слово це означає?</p><button class="say" data-say="${c.word}">🔊 послухати</button>
      <div class="def">${c.def}</div>
    ${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.o===c.word;
      b.className="opt "+(ok?"right":"wrong");
      if(ok)session.right++;else session.wrong++;
      grade(i,ok?2:0);
      setTimeout(()=>{qi++;shown=false;render();},550);
    });
  }
}

// REVIEW: recall first (cloze), self-grade — the strongest form of practice
function review(){
  if(qi>=queue.length)return done();
  const i=queue[qi],c=w(i);
  const useCloze=(P.words[i].seen%2===0);
  if(!shown){
    app.innerHTML=bar()+`<div class="top"><span class="pill">Повторення ${qi+1} з ${queue.length}</span>
      <span class="pill">${state(i)==="known"?"засвоєне":"вивчається"}</span></div>
    <div class="card">
      ${useCloze?`<p class="muted">Яке слово пропущене?</p><div class="cloze">${clozeHtml(c.ex)}</div>`
                :`<p class="muted">Що означає це слово?</p><div class="word">${c.word}</div><div class="pos">/${c.ipa}/ · ${c.pos}</div>`}
      <p class="muted">Згадай сам, вголос, і лише потім відкривай.</p>
    </div>
    <button class="go" id="s">Показати відповідь</button>`;
    document.getElementById("s").onclick=()=>{shown=true;render();};
  }else{
    app.innerHTML=`<div class="card">
      <div class="word">${c.word}</div><div class="pos">/${c.ipa}/ · ${c.pos}</div>
      <button class="say" data-say="${c.word}">🔊 послухати</button>
      <div class="def">${c.def}</div>
      <div class="ex">${exHtml(c.ex)}</div>
      ${c.ant!=="—"?`<div class="anto">opposite: ${c.ant}</div>`:""}
    </div>
    <p class="muted">Наскільки легко згадалося?</p>
    <div class="grade">
      <button class="g0" data-g="0">Не згадав<small>ще раз сьогодні</small></button>
      <button data-g="1">Важко<small>той самий проміжок</small></button>
      <button data-g="2">Добре<small>наступний проміжок</small></button>
      <button class="g3" data-g="3">Легко<small>через два</small></button>
    </div>`;
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const g=+b.dataset.g;
      if(g===0){session.wrong++;queue.push(i);}else session.right++;
      grade(i,g);qi++;shown=false;render();
    });
  }
}

function done(){
  const t=today();
  if(P.last!==t){P.streak=(P.last&&daysBetween(P.last,t)===1)?(P.streak||0)+1:1;P.last=t;save();}
  const tot=session.right+session.wrong;
  app.innerHTML=`<h1>Готово</h1>
  <div class="card">
    <div class="row"><span>Правильно</span><b>${session.right}</b></div>
    <div class="row"><span>Помилок</span><b>${session.wrong}</b></div>
    <div class="row"><span>Точність</span><b>${tot?Math.round(100*session.right/tot):0}%</b></div>
    <div class="row"><span>Днів поспіль</span><b>${P.streak||1}</b></div>
  </div>
  ${session.mode==="learn"?`<div class="card muted"><p>Ці слова повернуться завтра. Сьогодні ще спробуй зустріти хоч одне з них у книжці або сказати вголос своє речення з ним — слово закріплюється від використання, а не від картки.</p></div>`:""}
  <button class="go" id="h">На головну</button>`;
  document.getElementById("h").onclick=()=>{view="home";render();};
}

function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;
   speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function wireSay(){app.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say);});}

function backup(){
  const data=JSON.stringify(P);
  app.innerHTML=`<h1>Резервна копія</h1>
  <div class="card">
    <p class="muted">Скопіюй цей текст і збережи будь-де — у нотатках або листом собі. З нього прогрес відновлюється повністю.</p>
    <textarea id="out" readonly style="width:100%;height:110px;font-size:12px;font-family:monospace;border:1px solid var(--line);border-radius:4px;padding:8px">${data}</textarea>
    <button class="go" id="cp" style="margin-top:10px">Скопіювати</button>
  </div>
  <div class="card">
    <p><b>Відновити</b></p>
    <p class="muted">Встав збережений текст і натисни «Відновити». Поточний прогрес буде замінено.</p>
    <textarea id="in" style="width:100%;height:90px;font-size:12px;font-family:monospace;border:1px solid var(--line);border-radius:4px;padding:8px"></textarea>
    <button class="go ghost" id="rs" style="margin-top:10px">Відновити</button>
    <div id="msg" class="muted" style="margin-top:8px"></div>
  </div>
  <button class="go ghost" id="h">Назад</button>`;
  document.getElementById("cp").onclick=async()=>{
    const t=document.getElementById("out");t.select();
    try{await navigator.clipboard.writeText(data);}catch(e){try{document.execCommand("copy");}catch(e2){}}
    document.getElementById("cp").textContent="Скопійовано";
  };
  document.getElementById("rs").onclick=async()=>{
    const raw=document.getElementById("in").value.trim();
    const m=document.getElementById("msg");
    try{
      const o=JSON.parse(raw);
      if(!o.words) throw new Error("bad");
      P=o; if(!P.log)P.log={};
      await Store.write(JSON.stringify(P));
      m.textContent="Відновлено: "+Object.keys(P.words).length+" слів.";
    }catch(e){m.textContent="Не вдалося прочитати текст. Перевір, чи скопійовано повністю.";}
  };
  document.getElementById("h").onclick=()=>{view="home";render();};
}
function render(){
  if(view==="home")home();
  else if(view==="learn")learn();
  else if(view==="review")review();
  else if(view==="backup")backup();
  wireSay();
}
load().then(render);
</script>
</body></html>
